[package]
name = "factorycore"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Rust SDK for Factory Core factory_v1 Wasm programs"

[features]
default = ["panic-handler"]
# Installs a panic handler that reports the panic message and location to the
# controller log before trapping. Disable it to provide your own handler.
panic-handler = []

[dependencies]
factorycore-macros = { path = "../factorycore-macros", version = "2.0.0" }

[dev-dependencies]
trybuild = "1"
