[package]
name = "factorycore-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Procedural macros for the Factory Core Rust SDK (use through the factorycore crate)"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full"] }
