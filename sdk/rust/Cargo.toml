[workspace]
members = ["factorycore", "factorycore-macros", "examples/smelter", "examples/counter"]
resolver = "3"

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.95.0"
publish = false

[profile.release]
panic = "abort"
opt-level = "s"
strip = true
lto = true
codegen-units = 1
