plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'com.diffplug.spotless' version '8.1.0'
    id 'pmd'
}

group = 'dev.izzy.factorycore'
version = '0.1.0-dev'
base.archivesName = 'factorycore'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
}

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations.gameTestImplementation.extendsFrom(configurations.implementation)
configurations.gameTestRuntimeOnly.extendsFrom(configurations.runtimeOnly)

neoForge {
    version = '21.1.252'
    addModdingDependenciesTo(sourceSets.gameTest)
    mods {
        factorycore { sourceSet(sourceSets.main) }
        factorycore_tests { sourceSet(sourceSets.gameTest) }
    }
    runs {
        client {
            client()
            gameDirectory = file('run/client')
            loadedMods = [mods.factorycore]
        }
        server {
            server()
            gameDirectory = file('run/server')
            programArgument '--nogui'
            loadedMods = [mods.factorycore]
        }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gameTest
            gameDirectory = file('build/gametest-run')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'factorycore_tests'
            systemProperty 'factorycore.test.report', file('build/reports/gametest/results.xml').absolutePath
            loadedMods = [mods.factorycore, mods.factorycore_tests]
        }
    }
    unitTest {
        enable()
        testedMod = mods.factorycore
        loadedMods = [mods.factorycore]
    }
}

tasks.named('runGameTestServer', JavaExec) {
    doFirst {
        // Only generated test state is reset. Client and dedicated-server worlds are separate.
        delete file('build/gametest-run/world')
        def report = file('build/reports/gametest/results.xml')
        report.parentFile.mkdirs()
        if (report.exists() && !report.delete()) throw new GradleException('Cannot clear stale GameTest report.')
    }
    doLast {
        def report = file('build/reports/gametest/results.xml')
        if (!report.isFile()) throw new GradleException('Required GameTest report is missing.')
        def parsed = new groovy.xml.XmlParser().parse(report)
        def cases = parsed.depthFirst().findAll { it.name() == 'testcase' }
        if (cases.isEmpty() || parsed.depthFirst().any { it.name() in ['failure', 'error', 'skipped'] }) {
            throw new GradleException('Required GameTests must execute and pass without skips.')
        }
    }
}
tasks.named('check') { dependsOn tasks.named('runGameTestServer') }

tasks.named('runServer', JavaExec) {
    standardInput = System.in
}

dependencies {
    testImplementation 'com.dylibso.chicory:runtime:1.7.5'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
    testImplementation('com.tngtech.archunit:archunit:1.4.1') {
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }
}

dependencyLocking { lockAllConfigurations() }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:all', '-Werror'])
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    afterSuite { descriptor, result ->
        if (descriptor.parent == null && (result.testCount == 0 || result.skippedTestCount > 0)) {
            throw new GradleException('Required JVM tests must execute and cannot be skipped.')
        }
    }
}

tasks.register('verifyRustGuest', Exec) {
    commandLine(System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows') ? 'python' : 'python3', 'scripts/verify_guest.py')
    inputs.files(fileTree('experiments/wasm-guest'), file('scripts/verify_guest.py'))
    outputs.file('build/test-guests/probe.wasm')
}

tasks.named('test') {
    dependsOn tasks.named('jar'), tasks.named('verifyRustGuest')
    systemProperty 'factorycore.test.jar', tasks.named('jar').get().archiveFile.get().asFile.absolutePath
    systemProperty 'factorycore.test.guest', file('build/test-guests/probe.wasm').absolutePath
    inputs.file('build/test-guests/probe.wasm')
}

spotless {
    java {
        googleJavaFormat('1.28.0')
        target 'src/**/*.java'
    }
}

pmd {
    toolVersion = '7.17.0'
    ruleSets = []
    ruleSetFiles = files('config/pmd/ruleset.xml')
    consoleOutput = true
}

tasks.named('processResources') {
    inputs.property('version', project.version)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(version: project.version)
    }
}

tasks.named('jar') {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.register('coreBenchmark', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.izzy.factorycore.benchmark.CoreBenchmark'
    maxHeapSize = '2g'
}

tasks.register('wasmBenchmark', JavaExec) {
    dependsOn tasks.named('testClasses'), tasks.named('verifyRustGuest')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.izzy.factorycore.wasm.WasmBenchmark'
    maxHeapSize = '2g'
    systemProperty 'factorycore.test.guest', file('build/test-guests/probe.wasm').absolutePath
}
