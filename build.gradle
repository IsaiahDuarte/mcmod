plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'com.diffplug.spotless' version '8.1.0'
    id 'pmd'
}

group = 'dev.izzy.factorycore'
version = '0.1.0-dev'
base.archivesName = 'factorycore'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    // JEI is an optional, compile-only integration (ADR 0043).
    exclusiveContent {
        forRepository { maven { url = 'https://maven.blamejared.com' } }
        // mezz_config is JEI's own runtime dependency, needed only by the isolated JEI client run.
        filter { includeGroup 'mezz.jei'; includeGroup 'net.mezzdev.config' }
    }
}

sourceSets {
    clientTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    gameTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    // Isolated JEI graphical run (ADR 0043): the only source set with JEI at runtime.
    jeiTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations.clientTestImplementation.extendsFrom(configurations.implementation)
configurations.clientTestRuntimeOnly.extendsFrom(configurations.runtimeOnly)
sourceSets.main.resources { srcDir 'src/generated/resources'; exclude '.cache/' }
configurations.gameTestImplementation.extendsFrom(configurations.implementation)
configurations.gameTestRuntimeOnly.extendsFrom(configurations.runtimeOnly)
configurations.jeiTestImplementation.extendsFrom(configurations.implementation)
configurations.jeiTestRuntimeOnly.extendsFrom(configurations.runtimeOnly)

neoForge {
    version = '21.1.252'
    addModdingDependenciesTo(sourceSets.gameTest)
    addModdingDependenciesTo(sourceSets.clientTest)
    addModdingDependenciesTo(sourceSets.jeiTest)
    mods {
        factorycore { sourceSet(sourceSets.main) }
        factorycore_tests { sourceSet(sourceSets.gameTest) }
        factorycore_client_tests { sourceSet(sourceSets.clientTest) }
        factorycore_jei_tests { sourceSet(sourceSets.jeiTest) }
    }
    runs {
        // runData regenerates src/generated/resources from the registry (FactoryCoreData).
        data {
            data()
            gameDirectory = file('build/data-run')
            loadedMods = [mods.factorycore]
            programArguments.addAll('--mod', 'factorycore', '--all', '--output', file('src/generated/resources').absolutePath,
                '--existing', file('src/main/resources').absolutePath)
        }
        // The same generation into build/, compared with the committed tree by checkGeneratedResources.
        dataCheck {
            data()
            gameDirectory = file('build/data-check-run')
            loadedMods = [mods.factorycore]
            programArguments.addAll('--mod', 'factorycore', '--all', '--output', file('build/generated-check').absolutePath,
                '--existing', file('src/main/resources').absolutePath)
        }
        client {
            client()
            gameDirectory = file('run/client')
            loadedMods = [mods.factorycore]
        }
        server {
            server()
            gameDirectory = file('run/server')
            programArgument '--nogui'
            loadedMods = [mods.factorycore]
        }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gameTest
            gameDirectory = file('build/gametest-run')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'factorycore_tests'
            systemProperty 'factorycore.test.report', file('build/reports/gametest/results.xml').absolutePath
            systemProperty 'factorycore.test.smelter', file('build/test-guests/smelter.wasm').absolutePath
            systemProperty 'factorycore.test.counter', file('build/test-guests/counter.wasm').absolutePath
            systemProperty 'factorycore.noWelcomeGuide', 'true'
            loadedMods = [mods.factorycore, mods.factorycore_tests]
        }
        automaticThroughputServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gameTest
            gameDirectory = file('build/automatic-throughput-run')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'factorycore_throughput_tests'
            systemProperty 'factorycore.test.report', file('build/reports/automatic-throughput/results.xml').absolutePath
            systemProperty 'factorycore.noWelcomeGuide', 'true'
            loadedMods = [mods.factorycore, mods.factorycore_tests]
        }
    }
    unitTest {
        enable()
        testedMod = mods.factorycore
        loadedMods = [mods.factorycore]
    }
}

// Verification runs: the client-test mod in a dedicated server (--nogui) or a real client. Each
// option maps to the run model; props become factorycore.* system properties (Files as paths).
def reportFile = { String path -> file("build/reports/${path}") }
def verificationRun = { Map o, String name ->
    neoForge.runs.register(name) {
        if (o.client) {
            client()
        } else {
            server()
            programArgument '--nogui'
        }
        sourceSet = o.sourceSet ?: sourceSets.clientTest
        gameDirectory = file("build/${o.dir}")
        loadedMods = o.mods ?: [neoForge.mods.factorycore, neoForge.mods.factorycore_client_tests]
        o.get('jvm', []).each { jvmArgument it }
        o.get('args', []).each { programArgument it }
        o.get('props', [:]).each { key, value ->
            systemProperty "factorycore.${key}", value instanceof File ? value.absolutePath : value.toString()
        }
    }
}
def clientReport = { String suite -> [noWelcomeGuide: true, 'client.report': reportFile("${suite}/result.txt")] }

verificationRun('gatewayDepthServer', dir: 'gateway-depth-run',
    props: ['wireless.server': true, 'wireless.depthLimited': true, 'wireless.report': reportFile('gateway-depth/result.txt')])
verificationRun('wirelessLifecycleServer', dir: 'wireless-lifecycle-run',
    props: ['wireless.server': true, 'wireless.report': reportFile('wireless-lifecycle/result.txt')])
verificationRun('jeiClient', client: true, dir: 'client-jei-run', sourceSet: sourceSets.jeiTest,
    mods: [neoForge.mods.factorycore, neoForge.mods.factorycore_jei_tests], props: clientReport('client-jei'))
verificationRun('terminalClient', client: true, dir: 'client-terminal-run', props: clientReport('client-terminal'))
verificationRun('presentationClient', client: true, dir: 'client-presentation-run',
    props: clientReport('client-presentation') + [presentation: true])
verificationRun('terminalRestartClient', client: true, dir: 'client-terminal-run',
    props: clientReport('client-restart') + ['client.seed': reportFile('client-terminal/restart.properties'), 'client.restart': true])
verificationRun('benchmarkServer', dir: 'benchmark-server-run', jvm: ['-Xmx2g'],
    props: ['bench.server': true, 'bench.output': file('build/benchmarks')])
// Seed/restore pairs share a world directory; the restore run reopens what the seed saved.
[seed: false, recovery: true].each { phase, restore ->
    verificationRun("staging${phase.capitalize()}Server", dir: 'staging-server-run',
        props: ['staging.server': true, 'staging.report': reportFile("staging-server/${restore ? 'restore' : 'seed'}.txt"),
                'staging.expected': reportFile('staging-server/expected.properties')] + (restore ? ['staging.restore': true] : [:]))
}
[saveOrder: [:], saveOrderChunks: ['saveorder.order': 'chunks-old']].each { suite, extra ->
    def dir = suite == 'saveOrder' ? 'save-order' : 'save-order-chunks'
    [seed: false, restore: true].each { phase, restore ->
        verificationRun("${suite}${phase.capitalize()}Server", dir: "${dir}-run",
            props: ['saveorder.server': true, 'saveorder.report': reportFile("${dir}/${phase}.txt"),
                    'saveorder.expected': reportFile("${dir}/expected.properties")] + extra + (restore ? ['saveorder.restore': true] : [:]))
    }
}
['seed', 'kill', 'data-old', 'chunks-old'].each { variant ->
    verificationRun('interruption' + variant.split('-').collect { it.capitalize() }.join('') + 'Server', dir: "interruption-run/${variant}",
        props: ['interruption.server': true, 'interruption.variant': variant, 'interruption.report': reportFile("interruption/${variant}.txt"),
                'interruption.expected': reportFile('interruption/expected.properties')])
}
// Multiplayer check (manual, needs a display): one dedicated server and two real clients.
verificationRun('multiplayerServer', dir: 'multiplayer-server-run',
    props: ['multiplayer.server': true, 'multiplayer.dir': reportFile('multiplayer'), noWelcomeGuide: true])
[owner: 'FactoryOwner', stranger: 'FactoryGuest'].each { role, username ->
    verificationRun("multiplayer${role.capitalize()}Client", client: true, dir: "multiplayer-${role}-run", args: ['--username', username],
        props: ['multiplayer.role': role, 'multiplayer.dir': reportFile('multiplayer'), noWelcomeGuide: true])
}

// A flat, structure-free world for dedicated-server runs; overrides replace or add properties.
def flatWorld = { File directory, Map overrides = [:] ->
    def settings = [
        'level-type': 'minecraft:flat',
        'generator-settings': '{"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}],"biome":"minecraft:plains"}',
        'level-seed': 385918, 'generate-structures': false, 'server-ip': '127.0.0.1', 'server-port': 0,
        'online-mode': false, 'view-distance': 2, 'simulation-distance': 2] + overrides
    directory.mkdirs()
    new File(directory, 'server.properties').text = settings.collect { key, value -> "${key}=${value}" }.join('\n') + '\n'
}
// A verification run passes only by writing a report that starts with PASS.
def requirePass = { File result, String failure ->
    if (!result.isFile() || !result.text.startsWith('PASS\n')) throw new GradleException(failure)
}
// Every name in the suite's capture manifest must exist as a non-empty screenshot.
def requireCaptures = { String manifest, File screenshots ->
    def missing = file(manifest).readLines()*.trim().findAll { it && !it.startsWith('#') }.findAll { name ->
        def capture = new File(screenshots, name)
        !capture.isFile() || capture.length() == 0
    }
    if (missing) throw new GradleException("Screenshots missing from ${screenshots}: ${missing}")
}

tasks.named('runGameTestServer', JavaExec) {
    doFirst {
        // Only generated test state is reset. Client and dedicated-server worlds are separate.
        delete file('build/gametest-run/world')
        def report = file('build/reports/gametest/results.xml')
        report.parentFile.mkdirs()
        if (report.exists() && !report.delete()) throw new GradleException('Cannot clear stale GameTest report.')
    }
    doLast {
        def report = file('build/reports/gametest/results.xml')
        if (!report.isFile()) throw new GradleException('Required GameTest report is missing.')
        def parsed = new groovy.xml.XmlParser().parse(report)
        def cases = parsed.depthFirst().findAll { it.name() == 'testcase' }
        if (cases.isEmpty() || parsed.depthFirst().any { it.name() in ['failure', 'error', 'skipped'] }) {
            throw new GradleException('Required GameTests must execute and pass without skips.')
        }
    }
}
tasks.named('check') { dependsOn tasks.named('runGameTestServer') }

// Slow dedicated-server suites (separate JVMs, restarts, SIGKILL, save skew, fresh worlds).
// `check` stays the fast inner loop; `python scripts/verify.py --full` runs both.
tasks.register('releaseCheck') {
    group = 'verification'
    description = 'Runs every dedicated-server recovery, restart and workload suite.'
}
tasks.named('runGameTestServer') { dependsOn tasks.named('verifyRustGuest') }

tasks.named('runAutomaticThroughputServer', JavaExec) {
    doFirst {
        delete file('build/automatic-throughput-run/world')
        def report = file('build/reports/automatic-throughput/results.xml')
        report.parentFile.mkdirs()
        if (report.exists() && !report.delete()) throw new GradleException('Cannot clear throughput report.')
    }
    doLast {
        def report = file('build/reports/automatic-throughput/results.xml')
        if (!report.isFile()) throw new GradleException('Automatic throughput report missing.')
        def parsed = new groovy.xml.XmlParser().parse(report)
        def cases = parsed.depthFirst().findAll { it.name() == 'testcase' }
        if (cases.size() != 1 || parsed.depthFirst().any { it.name() in ['failure', 'error', 'skipped'] })
            throw new GradleException('The isolated automatic throughput regression must execute and pass.')
    }
}

tasks.named('runServer', JavaExec) {
    standardInput = System.in
}

dependencies {
    // Optional JEI integration: API at compile time only; never bundled or required (A14).
    compileOnly 'mezz.jei:jei-1.21.1-common-api:19.57.0.451'
    compileOnly 'mezz.jei:jei-1.21.1-neoforge-api:19.57.0.451'
    jeiTestCompileOnly 'mezz.jei:jei-1.21.1-common-api:19.57.0.451'
    jeiTestCompileOnly 'mezz.jei:jei-1.21.1-neoforge-api:19.57.0.451'
    jeiTestRuntimeOnly 'mezz.jei:jei-1.21.1-neoforge:19.57.0.451'
    // Production guest runtime (ADR 0037): embedded in the mod jar and on dev run classpaths.
    implementation 'com.dylibso.chicory:runtime:1.7.5'
    implementation 'com.dylibso.chicory:wasm:1.7.5'
    additionalRuntimeClasspath 'com.dylibso.chicory:runtime:1.7.5'
    additionalRuntimeClasspath 'com.dylibso.chicory:wasm:1.7.5'
    jarJar('com.dylibso.chicory:runtime') { version { strictly '[1.7.5]'; prefer '1.7.5' } }
    jarJar('com.dylibso.chicory:wasm') { version { strictly '[1.7.5]'; prefer '1.7.5' } }
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
    testImplementation('com.tngtech.archunit:archunit:1.4.1') {
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }
}

dependencyLocking { lockAllConfigurations() }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:all', '-Werror'])
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    afterSuite { descriptor, result ->
        if (descriptor.parent == null && (result.testCount == 0 || result.skippedTestCount > 0)) {
            throw new GradleException('Required JVM tests must execute and cannot be skipped.')
        }
    }
}

tasks.register('verifyRustGuest', Exec) {
    commandLine(System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows') ? 'python' : 'python3', 'scripts/verify_guest.py')
    inputs.files(fileTree('sdk/rust') { exclude 'target/**' }, file('scripts/verify_guest.py'))
    outputs.files('build/test-guests/smelter.wasm', 'build/test-guests/counter.wasm', 'build/test-guests/restock.wasm', 'build/test-guests/furnace.wasm')
}

tasks.named('test') {
    dependsOn tasks.named('jar'), tasks.named('verifyRustGuest')
    systemProperty 'factorycore.test.jar', tasks.named('jar').get().archiveFile.get().asFile.absolutePath
    systemProperty 'factorycore.test.smelter', file('build/test-guests/smelter.wasm').absolutePath
    systemProperty 'factorycore.test.counter', file('build/test-guests/counter.wasm').absolutePath
    systemProperty 'factorycore.test.restock', file('build/test-guests/restock.wasm').absolutePath
    systemProperty 'factorycore.test.furnace', file('build/test-guests/furnace.wasm').absolutePath
    systemProperty 'factorycore.test.sdk', file('sdk/rust/factorycore/src/sys.rs').absolutePath
    systemProperty 'factorycore.test.sources', file('src/main/java').absolutePath
    inputs.dir('src/main/java')
    inputs.files('build/test-guests/smelter.wasm', 'build/test-guests/counter.wasm', 'build/test-guests/restock.wasm', 'build/test-guests/furnace.wasm', 'sdk/rust/factorycore/src/sys.rs')
}

spotless {
    java {
        googleJavaFormat('1.28.0')
        target 'src/**/*.java'
    }
}

pmd {
    toolVersion = '7.17.0'
    ruleSets = []
    ruleSetFiles = files('config/pmd/ruleset.xml')
    consoleOutput = true
}

// PMD logs a misconfigured or crashing rule and continues, which silently disables it. Its XML
// report records those as <error> elements; treat any as a failed check.
tasks.withType(Pmd).configureEach { pmdTask ->
    doLast {
        def report = pmdTask.reports.xml.outputLocation.get().asFile
        if (report.isFile()) {
            def errors = new groovy.xml.XmlSlurper().parse(report).'**'.findAll { it.name() == 'error' }
            if (errors) throw new GradleException("PMD could not apply its rules (${errors.size()} errors); see ${report}: ${errors[0].@msg}")
        }
    }
}

tasks.named('processResources') {
    inputs.property('version', project.version)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(version: project.version)
    }
}

tasks.named('jar') {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.register('coreBenchmark', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.izzy.factorycore.benchmark.CoreBenchmark'
    maxHeapSize = '2g'
}

tasks.register('wasmBenchmark', JavaExec) {
    dependsOn tasks.named('testClasses'), tasks.named('verifyRustGuest')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.izzy.factorycore.core.wasm.WasmBenchmark'
    maxHeapSize = '2g'
    systemProperty 'factorycore.test.smelter', file('build/test-guests/smelter.wasm').absolutePath
}


// Compile the isolated graphical fixture in the canonical gate; run it explicitly on a desktop.
tasks.named('check') { dependsOn tasks.named('compileClientTestJava'), tasks.named('compileJeiTestJava') }
tasks.named('runJeiClient', JavaExec) {
    doFirst {
        delete file('build/client-jei-run/saves/factorycore-jei-verification')
        delete reportFile('client-jei')
    }
    doLast {
        requirePass(reportFile('client-jei/result.txt'), 'JEI graphical verification did not complete.')
        requireCaptures('src/jeiTest/resources/captures/jei.txt', reportFile('client-jei/screenshots'))
    }
}
tasks.named('runTerminalClient', JavaExec) {
    doFirst {
        delete file('build/client-terminal-run/saves/factorycore-terminal-verification')
        delete reportFile('client-terminal')
    }
    doLast {
        requirePass(reportFile('client-terminal/result.txt'), 'Graphical terminal verification did not complete.')
        requireCaptures('src/clientTest/resources/captures/terminal.txt', reportFile('client-terminal/screenshots'))
    }
}

// Presentation gallery: orientations, lamps/bays, held items, tooltips and every screen at GUI
// scales 1-4 in the smallest supported window. Needs a display; run explicitly, not part of check.
tasks.named('runPresentationClient', JavaExec) {
    doFirst {
        delete file('build/client-presentation-run/saves/factorycore-presentation-verification')
        delete reportFile('client-presentation')
    }
    doLast {
        requirePass(reportFile('client-presentation/result.txt'), 'Graphical presentation verification did not complete.')
        requireCaptures('src/clientTest/resources/captures/presentation.txt', reportFile('client-presentation/screenshots'))
    }
}

// Separate JVM: reopen the completed seed world instead of recreating or repairing it.
tasks.named('runTerminalRestartClient', JavaExec) {
    dependsOn tasks.named('runTerminalClient')
    doFirst { delete reportFile('client-restart') }
    doLast {
        requirePass(reportFile('client-restart/result.txt'), 'Separate-process world restart verification did not complete.')
        requireCaptures('src/clientTest/resources/captures/restart.txt', reportFile('client-restart/screenshots'))
    }
}

tasks.named('runWirelessLifecycleServer', JavaExec) {
    doFirst {
        delete file('build/wireless-lifecycle-run/world')
        delete reportFile('wireless-lifecycle')
        flatWorld(file('build/wireless-lifecycle-run'))
    }
    doLast { requirePass(reportFile('wireless-lifecycle/result.txt'), 'Native wireless endpoint lifecycle did not complete.') }
}
tasks.named('runGatewayDepthServer', JavaExec) {
    doFirst {
        delete file('build/gateway-depth-run/world')
        delete reportFile('gateway-depth')
        flatWorld(file('build/gateway-depth-run'))
        def config = file('build/gateway-depth-run/world/serverconfig/factorycore-server.toml')
        config.parentFile.mkdirs()
        config.text = '[network]\ngatewayDepth=1\n'
    }
    doLast { requirePass(reportFile('gateway-depth/result.txt'), 'Configured gateway nesting verification did not complete.') }
}

// Required headless native persistence probe: accepted calls, orderly exit, distinct-JVM recovery.
tasks.named('runStagingSeedServer', JavaExec) {
    doFirst {
        delete file('build/staging-server-run/world')
        delete reportFile('staging-server')
        flatWorld(file('build/staging-server-run'))
    }
    doLast { requirePass(reportFile('staging-server/seed.txt'), 'Native staging seed did not complete.') }
}
tasks.named('runStagingRecoveryServer', JavaExec) {
    dependsOn tasks.named('runStagingSeedServer')
    doLast { requirePass(reportFile('staging-server/restore.txt'), 'Native staging recovery did not complete.') }
}

// Required abrupt-kill and independent-save interruption of a real processing job (ADR 0057).
// The seed saves S1/S2/S3 then SIGKILLs itself; each restore runs on its own copy of that world.
tasks.named('runInterruptionSeedServer', JavaExec) {
    ignoreExitValue = true
    doFirst {
        delete file('build/interruption-run')
        delete reportFile('interruption')
        flatWorld(file('build/interruption-run/seed'))
    }
    doLast {
        requirePass(reportFile('interruption/seed.txt'), 'Interruption seed did not reach its kill point.')
        if (executionResult.get().exitValue != 137) throw new GradleException("Interruption seed was not killed (exit ${executionResult.get().exitValue}).")
    }
}
[kill: [:], 'data-old': ['data/factorycore_devices.dat': 's1', 'region/r.0.0.mca': 's2'], 'chunks-old': ['data/factorycore_devices.dat': 's2', 'region/r.0.0.mca': 's1']].each { variant, older ->
    tasks.named('runInterruption' + variant.split('-').collect { it.capitalize() }.join('') + 'Server', JavaExec) {
        dependsOn tasks.named('runInterruptionSeedServer')
        doFirst {
            def target = file("build/interruption-run/${variant}")
            delete target
            copy { from 'build/interruption-run/seed'; into target }
            older.each { path, save ->
                def source = file("${target}/world/${path.substring(0, path.lastIndexOf('.'))}.${save}")
                java.nio.file.Files.copy(source.toPath(), file("${target}/world/${path}").toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            }
        }
        doLast { requirePass(reportFile("interruption/${variant}.txt"), "Interruption ${variant} restore did not complete.") }
    }
}

// Required independent-save injection, both ways: canonical SavedData older than the chunks it
// describes (saveOrder), and chunks older than the SavedData (saveOrderChunks).
[saveOrder: ['save-order', 'data/factorycore_devices', 'SavedData', 'after chunks were saved but before SavedData was'],
 saveOrderChunks: ['save-order-chunks', 'region/r.0.0', 'region file', 'after SavedData was saved but before the chunks were']].each { suite, spec ->
    def dir = spec[0], stale = spec[1], what = spec[2]
    tasks.named("run${suite.capitalize()}SeedServer", JavaExec) {
        doFirst {
            delete file("build/${dir}-run/world")
            delete reportFile(dir)
            flatWorld(file("build/${dir}-run"))
        }
        doLast { requirePass(reportFile("${dir}/seed.txt"), 'Save-order seed did not complete.') }
    }
    tasks.named("run${suite.capitalize()}RestoreServer", JavaExec) {
        dependsOn tasks.named("run${suite.capitalize()}SeedServer")
        doFirst {
            def before = file("build/${dir}-run/world/${stale}.before")
            if (!before.isFile()) throw new GradleException("Save-order seed left no older ${what}.")
            // Simulate an interruption between the two saves (spec[3]).
            def current = file("build/${dir}-run/world/${stale}.${stale.startsWith('region') ? 'mca' : 'dat'}")
            java.nio.file.Files.copy(before.toPath(), current.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
        doLast { requirePass(reportFile("${dir}/restore.txt"), 'Save-order restore did not complete.') }
    }
}

// Generated resources are committed; this fails when they no longer match the registry.
tasks.register('checkGeneratedResources') {
    group = 'verification'
    description = 'Regenerates data into build/ and compares it with src/generated/resources.'
    dependsOn tasks.named('runDataCheck')
    doLast {
        def tree = { File root -> root.exists() ? fileTree(root) { exclude '.cache/**' }.files.collectEntries { [(root.toPath().relativize(it.toPath()).toString()): it.text] } : [:] }
        def committed = tree(file('src/generated/resources'))
        def fresh = tree(file('build/generated-check'))
        def stale = (committed.keySet() + fresh.keySet()).findAll { committed[it] != fresh[it] }.sort()
        if (stale) throw new GradleException("Generated resources are stale; run ./gradlew runData. Differs: ${stale}")
    }
}
tasks.named('runDataCheck') { doFirst { delete file('build/generated-check') } }
// Regenerate from scratch: the generator's hash cache would skip hand-edited or orphaned files.
tasks.named('runData') { doFirst { delete file('src/generated/resources') } }
tasks.named('check') { dependsOn tasks.named('checkGeneratedResources') }

tasks.named('releaseCheck') {
    dependsOn(['AutomaticThroughput', 'WirelessLifecycle', 'GatewayDepth', 'StagingRecovery', 'InterruptionKill',
               'InterruptionDataOld', 'InterruptionChunksOld', 'SaveOrderRestore', 'SaveOrderChunksRestore']
        .collect { tasks.named("run${it}Server") })
}

// Manual A15/D07 measurement (not part of check): dedicated-server workload benchmark.
tasks.named('runBenchmarkServer', JavaExec) {
    doFirst {
        delete file('build/benchmark-server-run/world')
        delete file('build/benchmarks/server-v1-summary.txt')
        delete file('build/benchmarks/server-v1.csv')
        flatWorld(file('build/benchmark-server-run'))
    }
    doLast { requirePass(file('build/benchmarks/server-v1-summary.txt'), 'Server benchmark did not pass conservation.') }
}

// Manual multiplayer check (not part of check; needs a display). Gradle runs JavaExec tasks of one
// project one at a time, so this task starts the three configured run command lines as concurrent
// processes: a dedicated server on a free localhost port and two graphical clients that join it
// over TCP. Each process gates on its own PASS file; required screenshots must exist.
def multiplayerRuns = ['runMultiplayerServer', 'runMultiplayerOwnerClient', 'runMultiplayerStrangerClient']
tasks.register('runMultiplayerCheck') {
    group = 'verification'
    description = 'Dedicated server plus two real graphical clients: permissions, concurrent terminals, policy.'
    dependsOn { multiplayerRuns.collect { tasks.named(it).get().taskDependencies } }
    doLast {
        def reports = file('build/reports/multiplayer')
        delete reports
        delete file('build/multiplayer-server-run/world')
        reports.mkdirs()
        int port = new ServerSocket(0, 0, InetAddress.getLoopbackAddress()).withCloseable { it.localPort }
        flatWorld(file('build/multiplayer-server-run'), ['server-port': port, 'enforce-secure-profile': false, 'spawn-protection': 0,
            'allow-flight': true, gamemode: 'survival', difficulty: 'peaceful', 'spawn-monsters': false, 'max-players': 4,
            'view-distance': 4, 'simulation-distance': 4])
        new File(reports, 'port.txt').text = "${port}\n"
        // Mirrors RunGameTask.exec(): its classpath, environment and game directory are applied at
        // execution time, so the command line is assembled from the same configured properties.
        def launch = { String name, String log ->
            def run = tasks.named(name, JavaExec).get()
            def directory = run.gameDirectory.get().asFile
            directory.mkdirs()
            def command = [run.javaLauncher.get().executablePath.asFile.absolutePath]
            command.addAll(run.allJvmArgs)
            command.addAll(['-cp', (run.classpath + run.classpathProvider).asPath, run.mainClass.get()])
            command.addAll(run.args)
            def builder = new ProcessBuilder(command.collect { it.toString() })
                .directory(directory)
                .redirectErrorStream(true)
                .redirectOutput(new File(reports, log))
            run.environmentProperty.get().each { key, value -> builder.environment().put(key, value.toString()) }
            builder.start()
        }
        def processes = []
        try {
            processes << launch('runMultiplayerServer', 'server.log')
            def ready = new File(reports, 'server.ready')
            long serverDeadline = System.currentTimeMillis() + 300_000
            while (!ready.isFile()) {
                if (!processes[0].alive) throw new GradleException('Multiplayer server exited before it was ready; see build/reports/multiplayer/server.log.')
                if (System.currentTimeMillis() > serverDeadline) throw new GradleException('Multiplayer server did not become ready.')
                Thread.sleep(500)
            }
            processes << launch('runMultiplayerOwnerClient', 'owner.log')
            processes << launch('runMultiplayerStrangerClient', 'stranger.log')
            long deadline = System.currentTimeMillis() + 900_000
            processes.each { process ->
                long remaining = deadline - System.currentTimeMillis()
                if (remaining <= 0 || !process.waitFor(remaining, java.util.concurrent.TimeUnit.MILLISECONDS))
                    throw new GradleException('Multiplayer check timed out; see build/reports/multiplayer/*.log.')
            }
        } finally {
            processes.each { process -> if (process.alive) process.destroyForcibly() }
        }
        ['server', 'owner', 'stranger'].each { role ->
            requirePass(reportFile("multiplayer/${role}/result.txt"), "Multiplayer ${role} did not pass; see build/reports/multiplayer/${role}/result.txt and ${role}.log.")
        }
        ['owner', 'stranger'].each { role ->
            requireCaptures("src/clientTest/resources/captures/multiplayer-${role}.txt", reportFile("multiplayer/${role}/screenshots"))
        }
    }
}
