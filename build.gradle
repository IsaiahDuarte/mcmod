plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'com.diffplug.spotless' version '8.1.0'
    id 'pmd'
}

group = 'dev.izzy.factorycore'
version = '0.1.0-dev'
base.archivesName = 'factorycore'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    // JEI is an optional, compile-only integration (ADR 0043).
    exclusiveContent {
        forRepository { maven { url = 'https://maven.blamejared.com' } }
        // mezz_config is JEI's own runtime dependency, needed only by the isolated JEI client run.
        filter { includeGroup 'mezz.jei'; includeGroup 'net.mezzdev.config' }
    }
}

sourceSets {
    clientTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    gameTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    // Isolated JEI graphical run (ADR 0043): the only source set with JEI at runtime.
    jeiTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations.clientTestImplementation.extendsFrom(configurations.implementation)
configurations.clientTestRuntimeOnly.extendsFrom(configurations.runtimeOnly)
configurations.gameTestImplementation.extendsFrom(configurations.implementation)
configurations.gameTestRuntimeOnly.extendsFrom(configurations.runtimeOnly)
configurations.jeiTestImplementation.extendsFrom(configurations.implementation)
configurations.jeiTestRuntimeOnly.extendsFrom(configurations.runtimeOnly)

neoForge {
    version = '21.1.252'
    addModdingDependenciesTo(sourceSets.gameTest)
    addModdingDependenciesTo(sourceSets.clientTest)
    addModdingDependenciesTo(sourceSets.jeiTest)
    mods {
        factorycore { sourceSet(sourceSets.main) }
        factorycore_tests { sourceSet(sourceSets.gameTest) }
        factorycore_client_tests { sourceSet(sourceSets.clientTest) }
        factorycore_jei_tests { sourceSet(sourceSets.jeiTest) }
    }
    runs {
        gatewayDepthServer {
            server()
            sourceSet = sourceSets.clientTest
            gameDirectory = file("build/gateway-depth-run")
            loadedMods = [mods.factorycore, mods.factorycore_client_tests]
            programArgument '--nogui'
            systemProperty "factorycore.wireless.server", "true"
            systemProperty "factorycore.wireless.depthLimited", "true"
            systemProperty "factorycore.wireless.report", file("build/reports/gateway-depth/result.txt").absolutePath
        }
        wirelessLifecycleServer {
            server()
            sourceSet = sourceSets.clientTest
            gameDirectory = file("build/wireless-lifecycle-run")
            loadedMods = [mods.factorycore, mods.factorycore_client_tests]
            programArgument '--nogui'
            systemProperty "factorycore.wireless.server", "true"
            systemProperty "factorycore.wireless.report", file("build/reports/wireless-lifecycle/result.txt").absolutePath
        }
        jeiClient {
            client()
            sourceSet = sourceSets.jeiTest
            gameDirectory = file("build/client-jei-run")
            loadedMods = [mods.factorycore, mods.factorycore_jei_tests]
            systemProperty "factorycore.client.report", file("build/reports/client-jei/result.txt").absolutePath
            systemProperty "factorycore.noWelcomeGuide", "true"
        }
        terminalClient {
            client()
            sourceSet = sourceSets.clientTest
            gameDirectory = file("build/client-terminal-run")
            loadedMods = [mods.factorycore, mods.factorycore_client_tests]
            systemProperty "factorycore.client.report", file("build/reports/client-terminal/result.txt").absolutePath
            systemProperty "factorycore.noWelcomeGuide", "true"
        }
        presentationClient {
            client()
            sourceSet = sourceSets.clientTest
            gameDirectory = file("build/client-presentation-run")
            loadedMods = [mods.factorycore, mods.factorycore_client_tests]
            systemProperty "factorycore.client.report", file("build/reports/client-presentation/result.txt").absolutePath
            systemProperty "factorycore.noWelcomeGuide", "true"
            systemProperty "factorycore.presentation", "true"
        }
        terminalRestartClient {
            client()
            sourceSet = sourceSets.clientTest
            gameDirectory = file("build/client-terminal-run")
            loadedMods = [mods.factorycore, mods.factorycore_client_tests]
            systemProperty "factorycore.client.report", file("build/reports/client-restart/result.txt").absolutePath
            systemProperty "factorycore.noWelcomeGuide", "true"
            systemProperty "factorycore.client.seed", file("build/reports/client-terminal/restart.properties").absolutePath
            systemProperty "factorycore.client.restart", "true"
        }
        stagingSeedServer {
            server()
            sourceSet = sourceSets.clientTest
            gameDirectory = file("build/staging-server-run")
            loadedMods = [mods.factorycore, mods.factorycore_client_tests]
            programArgument '--nogui'
            systemProperty "factorycore.staging.server", "true"
            systemProperty "factorycore.staging.report", file("build/reports/staging-server/seed.txt").absolutePath
            systemProperty "factorycore.staging.expected", file("build/reports/staging-server/expected.properties").absolutePath
        }
        stagingRecoveryServer {
            server()
            sourceSet = sourceSets.clientTest
            gameDirectory = file("build/staging-server-run")
            loadedMods = [mods.factorycore, mods.factorycore_client_tests]
            programArgument '--nogui'
            systemProperty "factorycore.staging.server", "true"
            systemProperty "factorycore.staging.restore", "true"
            systemProperty "factorycore.staging.report", file("build/reports/staging-server/restore.txt").absolutePath
            systemProperty "factorycore.staging.expected", file("build/reports/staging-server/expected.properties").absolutePath
        }
        benchmarkServer {
            server()
            sourceSet = sourceSets.clientTest
            gameDirectory = file("build/benchmark-server-run")
            loadedMods = [mods.factorycore, mods.factorycore_client_tests]
            programArgument '--nogui'
            jvmArgument '-Xmx2g'
            systemProperty "factorycore.bench.server", "true"
            systemProperty "factorycore.bench.output", file("build/benchmarks").absolutePath
        }
        saveOrderSeedServer {
            server()
            sourceSet = sourceSets.clientTest
            gameDirectory = file("build/save-order-run")
            loadedMods = [mods.factorycore, mods.factorycore_client_tests]
            programArgument '--nogui'
            systemProperty "factorycore.saveorder.server", "true"
            systemProperty "factorycore.saveorder.report", file("build/reports/save-order/seed.txt").absolutePath
            systemProperty "factorycore.saveorder.expected", file("build/reports/save-order/expected.properties").absolutePath
        }
        saveOrderRestoreServer {
            server()
            sourceSet = sourceSets.clientTest
            gameDirectory = file("build/save-order-run")
            loadedMods = [mods.factorycore, mods.factorycore_client_tests]
            programArgument '--nogui'
            systemProperty "factorycore.saveorder.server", "true"
            systemProperty "factorycore.saveorder.restore", "true"
            systemProperty "factorycore.saveorder.report", file("build/reports/save-order/restore.txt").absolutePath
            systemProperty "factorycore.saveorder.expected", file("build/reports/save-order/expected.properties").absolutePath
        }
        saveOrderChunksSeedServer {
            server()
            sourceSet = sourceSets.clientTest
            gameDirectory = file("build/save-order-chunks-run")
            loadedMods = [mods.factorycore, mods.factorycore_client_tests]
            programArgument '--nogui'
            systemProperty "factorycore.saveorder.server", "true"
            systemProperty "factorycore.saveorder.order", "chunks-old"
            systemProperty "factorycore.saveorder.report", file("build/reports/save-order-chunks/seed.txt").absolutePath
            systemProperty "factorycore.saveorder.expected", file("build/reports/save-order-chunks/expected.properties").absolutePath
        }
        saveOrderChunksRestoreServer {
            server()
            sourceSet = sourceSets.clientTest
            gameDirectory = file("build/save-order-chunks-run")
            loadedMods = [mods.factorycore, mods.factorycore_client_tests]
            programArgument '--nogui'
            systemProperty "factorycore.saveorder.server", "true"
            systemProperty "factorycore.saveorder.order", "chunks-old"
            systemProperty "factorycore.saveorder.restore", "true"
            systemProperty "factorycore.saveorder.report", file("build/reports/save-order-chunks/restore.txt").absolutePath
            systemProperty "factorycore.saveorder.expected", file("build/reports/save-order-chunks/expected.properties").absolutePath
        }
        // Multiplayer check (manual, needs a display): one dedicated server and two real clients.
        multiplayerServer {
            server()
            sourceSet = sourceSets.clientTest
            gameDirectory = file("build/multiplayer-server-run")
            loadedMods = [mods.factorycore, mods.factorycore_client_tests]
            programArgument '--nogui'
            systemProperty "factorycore.multiplayer.server", "true"
            systemProperty "factorycore.multiplayer.dir", file("build/reports/multiplayer").absolutePath
            systemProperty "factorycore.noWelcomeGuide", "true"
        }
        multiplayerOwnerClient {
            client()
            sourceSet = sourceSets.clientTest
            gameDirectory = file("build/multiplayer-owner-run")
            loadedMods = [mods.factorycore, mods.factorycore_client_tests]
            programArguments.addAll('--username', 'FactoryOwner')
            systemProperty "factorycore.multiplayer.role", "owner"
            systemProperty "factorycore.multiplayer.dir", file("build/reports/multiplayer").absolutePath
            systemProperty "factorycore.noWelcomeGuide", "true"
        }
        multiplayerStrangerClient {
            client()
            sourceSet = sourceSets.clientTest
            gameDirectory = file("build/multiplayer-stranger-run")
            loadedMods = [mods.factorycore, mods.factorycore_client_tests]
            programArguments.addAll('--username', 'FactoryGuest')
            systemProperty "factorycore.multiplayer.role", "stranger"
            systemProperty "factorycore.multiplayer.dir", file("build/reports/multiplayer").absolutePath
            systemProperty "factorycore.noWelcomeGuide", "true"
        }
        client {
            client()
            gameDirectory = file('run/client')
            loadedMods = [mods.factorycore]
        }
        server {
            server()
            gameDirectory = file('run/server')
            programArgument '--nogui'
            loadedMods = [mods.factorycore]
        }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gameTest
            gameDirectory = file('build/gametest-run')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'factorycore_tests'
            systemProperty 'factorycore.test.report', file('build/reports/gametest/results.xml').absolutePath
            systemProperty 'factorycore.test.smelter', file('build/test-guests/smelter.wasm').absolutePath
            systemProperty 'factorycore.test.counter', file('build/test-guests/counter.wasm').absolutePath
            systemProperty 'factorycore.noWelcomeGuide', 'true'
            loadedMods = [mods.factorycore, mods.factorycore_tests]
        }
        automaticThroughputServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gameTest
            gameDirectory = file('build/automatic-throughput-run')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'factorycore_throughput_tests'
            systemProperty 'factorycore.test.report', file('build/reports/automatic-throughput/results.xml').absolutePath
            systemProperty 'factorycore.noWelcomeGuide', 'true'
            loadedMods = [mods.factorycore, mods.factorycore_tests]
        }
    }
    unitTest {
        enable()
        testedMod = mods.factorycore
        loadedMods = [mods.factorycore]
    }
}

tasks.named('runGameTestServer', JavaExec) {
    doFirst {
        // Only generated test state is reset. Client and dedicated-server worlds are separate.
        delete file('build/gametest-run/world')
        def report = file('build/reports/gametest/results.xml')
        report.parentFile.mkdirs()
        if (report.exists() && !report.delete()) throw new GradleException('Cannot clear stale GameTest report.')
    }
    doLast {
        def report = file('build/reports/gametest/results.xml')
        if (!report.isFile()) throw new GradleException('Required GameTest report is missing.')
        def parsed = new groovy.xml.XmlParser().parse(report)
        def cases = parsed.depthFirst().findAll { it.name() == 'testcase' }
        if (cases.isEmpty() || parsed.depthFirst().any { it.name() in ['failure', 'error', 'skipped'] }) {
            throw new GradleException('Required GameTests must execute and pass without skips.')
        }
    }
}
tasks.named('check') { dependsOn tasks.named('runGameTestServer') }
tasks.named('runGameTestServer') { dependsOn tasks.named('verifyRustGuest') }

tasks.named('runAutomaticThroughputServer', JavaExec) {
    doFirst {
        delete file('build/automatic-throughput-run/world')
        def report = file('build/reports/automatic-throughput/results.xml')
        report.parentFile.mkdirs()
        if (report.exists() && !report.delete()) throw new GradleException('Cannot clear throughput report.')
    }
    doLast {
        def report = file('build/reports/automatic-throughput/results.xml')
        if (!report.isFile()) throw new GradleException('Automatic throughput report missing.')
        def parsed = new groovy.xml.XmlParser().parse(report)
        def cases = parsed.depthFirst().findAll { it.name() == 'testcase' }
        if (cases.size() != 1 || parsed.depthFirst().any { it.name() in ['failure', 'error', 'skipped'] })
            throw new GradleException('The isolated automatic throughput regression must execute and pass.')
    }
}
tasks.named('check') { dependsOn tasks.named('runAutomaticThroughputServer') }

tasks.named('runServer', JavaExec) {
    standardInput = System.in
}

dependencies {
    // Optional JEI integration: API at compile time only; never bundled or required (A14).
    compileOnly 'mezz.jei:jei-1.21.1-common-api:19.57.0.451'
    compileOnly 'mezz.jei:jei-1.21.1-neoforge-api:19.57.0.451'
    jeiTestCompileOnly 'mezz.jei:jei-1.21.1-common-api:19.57.0.451'
    jeiTestCompileOnly 'mezz.jei:jei-1.21.1-neoforge-api:19.57.0.451'
    jeiTestRuntimeOnly 'mezz.jei:jei-1.21.1-neoforge:19.57.0.451'
    // Production guest runtime (ADR 0037): embedded in the mod jar and on dev run classpaths.
    implementation 'com.dylibso.chicory:runtime:1.7.5'
    implementation 'com.dylibso.chicory:wasm:1.7.5'
    additionalRuntimeClasspath 'com.dylibso.chicory:runtime:1.7.5'
    additionalRuntimeClasspath 'com.dylibso.chicory:wasm:1.7.5'
    jarJar('com.dylibso.chicory:runtime') { version { strictly '[1.7.5]'; prefer '1.7.5' } }
    jarJar('com.dylibso.chicory:wasm') { version { strictly '[1.7.5]'; prefer '1.7.5' } }
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
    testImplementation('com.tngtech.archunit:archunit:1.4.1') {
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }
}

dependencyLocking { lockAllConfigurations() }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:all', '-Werror'])
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    afterSuite { descriptor, result ->
        if (descriptor.parent == null && (result.testCount == 0 || result.skippedTestCount > 0)) {
            throw new GradleException('Required JVM tests must execute and cannot be skipped.')
        }
    }
}

tasks.register('verifyRustGuest', Exec) {
    commandLine(System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows') ? 'python' : 'python3', 'scripts/verify_guest.py')
    inputs.files(fileTree('experiments/wasm-guest'), fileTree('sdk/rust') { exclude 'target/**' }, file('scripts/verify_guest.py'))
    outputs.files('build/test-guests/probe.wasm', 'build/test-guests/smelter.wasm', 'build/test-guests/counter.wasm')
}

tasks.named('test') {
    dependsOn tasks.named('jar'), tasks.named('verifyRustGuest')
    systemProperty 'factorycore.test.jar', tasks.named('jar').get().archiveFile.get().asFile.absolutePath
    systemProperty 'factorycore.test.guest', file('build/test-guests/probe.wasm').absolutePath
    systemProperty 'factorycore.test.smelter', file('build/test-guests/smelter.wasm').absolutePath
    systemProperty 'factorycore.test.counter', file('build/test-guests/counter.wasm').absolutePath
    inputs.files('build/test-guests/probe.wasm', 'build/test-guests/smelter.wasm', 'build/test-guests/counter.wasm')
}

spotless {
    java {
        googleJavaFormat('1.28.0')
        target 'src/**/*.java'
    }
}

pmd {
    toolVersion = '7.17.0'
    ruleSets = []
    ruleSetFiles = files('config/pmd/ruleset.xml')
    consoleOutput = true
}

tasks.named('processResources') {
    inputs.property('version', project.version)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(version: project.version)
    }
}

tasks.named('jar') {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.register('coreBenchmark', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.izzy.factorycore.benchmark.CoreBenchmark'
    maxHeapSize = '2g'
}

tasks.register('wasmBenchmark', JavaExec) {
    dependsOn tasks.named('testClasses'), tasks.named('verifyRustGuest')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.izzy.factorycore.wasm.WasmBenchmark'
    maxHeapSize = '2g'
    systemProperty 'factorycore.test.guest', file('build/test-guests/probe.wasm').absolutePath
}


// Compile the isolated graphical fixture in the canonical gate; run it explicitly on a desktop.
tasks.named('check') { dependsOn tasks.named('compileClientTestJava'), tasks.named('compileJeiTestJava') }
tasks.named('runJeiClient', JavaExec) {
    doFirst {
        delete file('build/client-jei-run/saves/factorycore-jei-verification')
        delete file('build/reports/client-jei')
    }
    doLast {
        def result = file('build/reports/client-jei/result.txt')
        if (!result.isFile() || !result.text.startsWith('PASS\n')) throw new GradleException('JEI graphical verification did not complete.')
        def captures = ['jei-terminal-overlay.png', 'jei-recipe-over-terminal.png', 'jei-terminal-filled.png', 'jei-program-ghost.png']
        if (captures.any { name ->
            def capture = file("build/reports/client-jei/screenshots/${name}")
            !capture.isFile() || capture.length() == 0
        }) throw new GradleException('JEI screenshots are missing.')
    }
}
tasks.named('runTerminalClient', JavaExec) {
    doFirst {
        delete file('build/client-terminal-run/saves/factorycore-terminal-verification')
        delete file('build/reports/client-terminal')
    }
    doLast {
        def result = file('build/reports/client-terminal/result.txt')
        if (!result.isFile() || !result.text.startsWith('PASS\n')) {
            throw new GradleException('Graphical terminal verification did not complete.')
        }
        def captures = ['scale-2-all-items.png', 'terminal-search-display-name.png', 'terminal-search-mod.png', 'terminal-search-tag.png', 'terminal-sort-quantity.png', 'terminal-search-reopened.png', 'terminal-preferences-before-restart.png', 'scale-3-iron.png', 'scale-4-iron.png', 'scale-4-next-page.png', 'buffer-scale-2-settings.png', 'buffer-scale-2-rules-page-1.png', 'buffer-scale-2-rules-page-2.png', 'buffer-scale-2-stock.png', 'buffer-scale-2-full.png', 'buffer-scale-3-inventory.png', 'buffer-scale-3-settings.png', 'buffer-scale-4-settings.png', 'buffer-scale-4-inventory.png', 'machine-scale-2-draft.png', 'machine-scale-3-draft.png', 'machine-scale-4-draft.png', 'machine-scale-4-reopened.png', 'machine-preset-scale-2-draft.png', 'machine-preset-scale-3-draft.png', 'machine-preset-scale-4-stock.png', 'terminal-grid-scale-4.png', 'terminal-grid-scale-2.png', 'gateway-policy-scale-2.png', 'gateway-policy-scale-4.png', 'program-editor-scale-2.png', 'program-inline-error-scale-2.png', 'program-native-items-scale-2.png', 'program-native-labels-scale-2.png', 'program-highlighted-scale-2.png', 'program-highlighted-scale-4.png', 'program-rule-preview-scale-4.png', 'guide-page-1.png', 'guide-page-2.png', 'terminal-fluids-scale-2.png', 'terminal-energy-scale-2.png', 'wireless-terminal-scale-2.png', 'art-blocks-front.png', 'art-blocks-top.png', 'art-cables.png', 'art-items-scale-2.png', 'art-items-scale-4.png']
        if (captures.any { name ->
            def capture = file("build/reports/client-terminal/screenshots/${name}")
            !capture.isFile() || capture.length() == 0
        }) {
            throw new GradleException('Graphical terminal screenshots are missing.')
        }
    }
}

// Presentation gallery: orientations, lamps/bays, held items, tooltips and every screen at GUI
// scales 1-4 in the smallest supported window. Needs a display; run explicitly, not part of check.
tasks.named('runPresentationClient', JavaExec) {
    doFirst {
        delete file('build/client-presentation-run/saves/factorycore-presentation-verification')
        delete file('build/reports/client-presentation')
    }
    doLast {
        def result = file('build/reports/client-presentation/result.txt')
        if (!result.isFile() || !result.text.startsWith('PASS\n'))
            throw new GradleException('Graphical presentation verification did not complete.')
        def screens = ['terminal', 'buffer', 'machine', 'program', 'gateway-policy', 'guide']
        def captures = ['orientation-north-east-up.png', 'orientation-south-west-down.png', 'states-day.png', 'states-day-close.png', 'states-night.png', 'states-night-close.png', 'held-first-person-network_controller.png', 'held-first-person-network_cable.png', 'held-first-person-factory_guide.png', 'held-third-person-gateway.png', 'tooltips-edges-scale-4.png', 'tooltips-edges-scale-2.png', 'terminal-scale-2.png', 'terminal-scale-3.png'] + screens.collectMany { ["${it}-scale-1.png", "${it}-scale-4.png"] }
        captures += [2, 4].collectMany { scale -> (1..3).collect { corner -> "tooltips-corner-${corner}-scale-${scale}.png" } }
        captures += ['machine-throughput', 'machine-overdrive', 'buffer-throughput', 'buffer-overdrive', 'guide-throughput'].collectMany { ["${it}-scale-1.png", "${it}-scale-4.png"] }
        captures += (0..1).collect { "upgrade-tooltip-${it}-scale-4.png" }
        def missing = captures.findAll { name ->
            def capture = file("build/reports/client-presentation/screenshots/${name}")
            !capture.isFile() || capture.length() == 0
        }
        if (missing) throw new GradleException("Presentation screenshots are missing: ${missing}")
    }
}

tasks.named('runWirelessLifecycleServer', JavaExec) {
    doFirst {
        delete file('build/wireless-lifecycle-run/world')
        delete file('build/reports/wireless-lifecycle')
        def settings = file('build/wireless-lifecycle-run/server.properties')
        settings.parentFile.mkdirs()
        settings.text = 'level-type=minecraft:flat\ngenerator-settings={"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}],"biome":"minecraft:plains"}\nlevel-seed=385918\ngenerate-structures=false\nserver-ip=127.0.0.1\nserver-port=0\nonline-mode=false\nview-distance=2\nsimulation-distance=2\n'
    }
    doLast {
        def result = file('build/reports/wireless-lifecycle/result.txt')
        if (!result.isFile() || !result.text.startsWith('PASS\n'))
            throw new GradleException('Native wireless endpoint lifecycle did not complete.')
    }
}
tasks.named('check') { dependsOn tasks.named('runWirelessLifecycleServer'), tasks.named('runGatewayDepthServer') }
tasks.named('runGatewayDepthServer', JavaExec) {
    doFirst {
        delete file('build/gateway-depth-run/world')
        delete file('build/reports/gateway-depth')
        def settings = file('build/gateway-depth-run/server.properties')
        settings.parentFile.mkdirs()
        settings.text = 'level-type=minecraft:flat\ngenerator-settings={"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}],"biome":"minecraft:plains"}\nlevel-seed=385918\ngenerate-structures=false\nserver-ip=127.0.0.1\nserver-port=0\nonline-mode=false\nview-distance=2\nsimulation-distance=2\n'
        def config = file('build/gateway-depth-run/world/serverconfig/factorycore-server.toml')
        config.parentFile.mkdirs()
        config.text = '[network]\ngatewayDepth=1\n'
    }
    doLast {
        def result = file('build/reports/gateway-depth/result.txt')
        if (!result.isFile() || !result.text.startsWith('PASS\n'))
            throw new GradleException('Configured gateway nesting verification did not complete.')
    }
}

// Separate JVM: reopen the completed seed world instead of recreating or repairing it.
tasks.named('runTerminalRestartClient', JavaExec) {
    dependsOn tasks.named('runTerminalClient')
    doFirst { delete file('build/reports/client-restart') }
    doLast {
        def result = file('build/reports/client-restart/result.txt')
        def terminalCapture = file('build/reports/client-restart/screenshots/restarted-terminal-preferences.png')
        if (!terminalCapture.isFile() || terminalCapture.length() < 1000) {
            throw new GradleException('Restarted terminal preference screenshot is missing.')
        }
        def capture = file('build/reports/client-restart/screenshots/restarted-machine-stock.png')
        if (!result.isFile() || !result.text.startsWith('PASS\n') || !capture.isFile() || capture.length() == 0) {
            throw new GradleException('Separate-process world restart verification did not complete.')
        }
    }
}

