// Manual multiplayer check (not part of check; needs a display). Gradle runs JavaExec tasks of one
// project one at a time, so this task starts the three configured run command lines as concurrent
// processes: a dedicated server on a free localhost port and two graphical clients that join it
// over TCP. Each process gates on its own PASS file; required screenshots must exist.
def multiplayerRuns = ['runMultiplayerServer', 'runMultiplayerOwnerClient', 'runMultiplayerStrangerClient']
tasks.register('runMultiplayerCheck') {
    group = 'verification'
    description = 'Dedicated server plus two real graphical clients: permissions, concurrent terminals, policy.'
    dependsOn { multiplayerRuns.collect { tasks.named(it).get().taskDependencies } }
    doLast {
        def reports = file('build/reports/multiplayer')
        delete reports
        delete file('build/multiplayer-server-run/world')
        reports.mkdirs()
        int port = new ServerSocket(0, 0, InetAddress.getLoopbackAddress()).withCloseable { it.localPort }
        def settings = file('build/multiplayer-server-run/server.properties')
        settings.parentFile.mkdirs()
        settings.text = 'level-type=minecraft:flat\ngenerator-settings={"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}],"biome":"minecraft:plains"}\nlevel-seed=385918\ngenerate-structures=false\nserver-ip=127.0.0.1\nserver-port=' + port + '\nonline-mode=false\nenforce-secure-profile=false\nspawn-protection=0\nallow-flight=true\ngamemode=survival\ndifficulty=peaceful\nspawn-monsters=false\nmax-players=4\nview-distance=4\nsimulation-distance=4\n'
        new File(reports, 'port.txt').text = "${port}\n"
        // Mirrors RunGameTask.exec(): its classpath, environment and game directory are applied at
        // execution time, so the command line is assembled from the same configured properties.
        def launch = { String name, String log ->
            def run = tasks.named(name, JavaExec).get()
            def directory = run.gameDirectory.get().asFile
            directory.mkdirs()
            def command = [run.javaLauncher.get().executablePath.asFile.absolutePath]
            command.addAll(run.allJvmArgs)
            command.addAll(['-cp', (run.classpath + run.classpathProvider).asPath, run.mainClass.get()])
            command.addAll(run.args)
            def builder = new ProcessBuilder(command.collect { it.toString() })
                .directory(directory)
                .redirectErrorStream(true)
                .redirectOutput(new File(reports, log))
            run.environmentProperty.get().each { key, value -> builder.environment().put(key, value.toString()) }
            builder.start()
        }
        def processes = []
        try {
            processes << launch('runMultiplayerServer', 'server.log')
            def ready = new File(reports, 'server.ready')
            long serverDeadline = System.currentTimeMillis() + 300_000
            while (!ready.isFile()) {
                if (!processes[0].alive) throw new GradleException('Multiplayer server exited before it was ready; see build/reports/multiplayer/server.log.')
                if (System.currentTimeMillis() > serverDeadline) throw new GradleException('Multiplayer server did not become ready.')
                Thread.sleep(500)
            }
            processes << launch('runMultiplayerOwnerClient', 'owner.log')
            processes << launch('runMultiplayerStrangerClient', 'stranger.log')
            long deadline = System.currentTimeMillis() + 900_000
            processes.each { process ->
                long remaining = deadline - System.currentTimeMillis()
                if (remaining <= 0 || !process.waitFor(remaining, java.util.concurrent.TimeUnit.MILLISECONDS))
                    throw new GradleException('Multiplayer check timed out; see build/reports/multiplayer/*.log.')
            }
        } finally {
            processes.each { process -> if (process.alive) process.destroyForcibly() }
        }
        ['server', 'owner', 'stranger'].each { role ->
            def result = file("build/reports/multiplayer/${role}/result.txt")
            if (!result.isFile() || !result.text.startsWith('PASS\n'))
                throw new GradleException("Multiplayer ${role} did not pass; see build/reports/multiplayer/${role}/result.txt and ${role}.log.")
        }
        def captures = [
            'owner': ['owner-policy-editable.png', 'owner-terminal-concurrent.png', 'owner-sees-stranger-take.png', 'owner-took-one.png', 'owner-sees-stranger-deposit.png', 'owner-concurrent-take.png', 'owner-after-revoke.png'],
            'stranger': ['stranger-terminal-denied.png', 'stranger-self-grant-refused.png', 'stranger-policy-readonly.png', 'stranger-view-only.png', 'stranger-take-denied.png', 'stranger-terminal-concurrent.png', 'stranger-took-one.png', 'stranger-sees-owner-take.png', 'stranger-deposited.png', 'stranger-concurrent-take.png', 'stranger-revoked-closed.png', 'stranger-operator-granted.png']]
        captures.each { role, names ->
            names.each { name ->
                def capture = file("build/reports/multiplayer/${role}/screenshots/${name}")
                if (!capture.isFile() || capture.length() == 0) throw new GradleException("Multiplayer screenshot missing: ${role}/${name}")
            }
        }
    }
}
